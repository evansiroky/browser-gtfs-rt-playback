# CI: runs on every pull request and every push to main (specs/deployment.md "CI"), and is called
# by deploy.yml so a deploy only follows a green run of exactly these jobs.
#
# Security: no cloud credentials and no `id-token` anywhere in this file; every job is read-only.
# The terraform job validates against the public provider registry without a backend, and the image
# job builds locally and never pushes. That is what makes it safe to run on any pull request.
#
# Called from deploy.yml with `deploy_gate: true`, which leaves out the two jobs that must not gate a
# deploy: `audit` (depends on a live advisory database, so a merge could fail checks that passed on
# its pull request) and `image` (the deploy job builds and smoke tests the image it ships).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      deploy_gate:
        description: Run only the checks that gate a deploy (no advisory audit, no image job).
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled. Runs on main (and the call from deploy.yml, whose
# group key is its own run id) are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run format:check

  # Informs, never blocks: it reads the live advisory database, so its result can change without a
  # commit. Production dependencies only; high and critical advisories raise a warning and a summary.
  audit:
    name: Dependency advisories (informational)
    if: ${{ !inputs.deploy_gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Report
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::warning::npm audit found high or critical advisories in production dependencies. This does not block the merge or a deploy; see the audit step."
          echo "### npm audit: advisories found" >> "$GITHUB_STEP_SUMMARY"
          echo "High or critical advisories exist in production dependencies. Run \`npm audit --omit=dev\` for the list." >> "$GITHUB_STEP_SUMMARY"

  scripts:
    name: Bootstrap and smoke-script tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: pip install shellcheck-py==0.11.0.1
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/test/*.sh scripts/test/fake-bin/* scripts/test/fake-tf/terraform
      - name: Bootstrap and teardown against a fake gcloud
        run: scripts/test/run-tests.sh
      # The smoke script's own tests drive the built server through a fake docker.
      - run: npm ci
      - run: npm run build
      - name: Smoke script tests
        run: scripts/test/container-smoke-tests.sh

  workflows:
    name: Workflow lint and security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint, shellcheck and PyYAML
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install actionlint-py==1.7.12.25 shellcheck-py==0.11.0.1 pyyaml==6.0.3
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: actionlint (runs shellcheck over every run block)
        run: actionlint -color
      - name: Security invariants of the workflows
        run: |
          python -I scripts/test/workflow-invariants.py --self-test
          python -I scripts/test/workflow-invariants.py

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.7 # infra/ needs >= 1.11; this is the version it was validated with
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff infra
      # No backend and no credentials: validate needs only the provider schema from the registry.
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate

  image:
    name: Container image (build only)
    if: ${{ !inputs.deploy_gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cloud Run runs linux/amd64 only. Built into the local daemon (BuildKit is built in) and never pushed.
      - name: Build
        run: docker build --platform linux/amd64 --build-arg GIT_SHA="$GITHUB_SHA" -t gtfs-rt-debugger:ci .
      - name: Smoke test the image
        run: scripts/container-smoke.sh gtfs-rt-debugger:ci
